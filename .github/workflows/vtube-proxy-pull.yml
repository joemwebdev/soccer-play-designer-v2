name: VTube Proxy Clip Pull

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Try public read-only proxies
        shell: bash
        run: |
          set -u
          mkdir -p clips
          SRC='https://i.4cdn.org/vt/1788660499049984.mp4'
          try_url() {
            name="$1"; url="$2"
            echo "TRY $name $url"
            curl -L --max-time 60 --retry 1 -A 'Mozilla/5.0' -e 'https://boards.4chan.org/' "$url" -o "clips/$name.bin" || true
            size=$(wc -c < "clips/$name.bin" 2>/dev/null || echo 0)
            mime=$(file -b --mime-type "clips/$name.bin" 2>/dev/null || true)
            echo "$name size=$size mime=$mime"
            if [ "$size" -gt 100000 ] && [[ "$mime" == video/* || "$mime" == application/octet-stream ]]; then
              cp "clips/$name.bin" clips/source.mp4
              return 0
            fi
            return 1
          }
          try_url direct "$SRC" || \
          try_url corsproxy "https://corsproxy.io/?url=${SRC}" || \
          try_url allorigins "https://api.allorigins.win/raw?url=${SRC}" || \
          try_url isogit "https://cors.isomorphic-git.org/${SRC}" || \
          try_url jina "https://r.jina.ai/${SRC}" || true
          ls -lh clips
          test -s clips/source.mp4
      - name: Upload resolved clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxied-vtube-clip
          path: clips/
          retention-days: 1
          compression-level: 0
