name: VTube source extract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download public mirrored candidate clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidates
          curl -L --fail --retry 2 -A "Mozilla/5.0" -e "https://boards.4chan.org/" -o candidates/A_biboo_scream.mp4 "https://i.4cdn.org/vt/1787491570177.mp4"
          curl -L --fail --retry 2 -A "Mozilla/5.0" -e "https://boards.4chan.org/" -o candidates/B_spaghet_related.mp4 "https://i.4cdn.org/vt/1787492418449.mp4"
          curl -L --fail --retry 2 -A "Mozilla/5.0" -e "https://boards.4chan.org/" -o candidates/C_kill_people_mori.mp4 "https://i.4cdn.org/vt/1787494576256.mp4"
          curl -L --fail --retry 2 -A "Mozilla/5.0" -e "https://boards.4chan.org/" -o candidates/D_hello.mp4 "https://i.4cdn.org/vt/1787499313814.mp4"
          curl -L --fail --retry 2 -A "Mozilla/5.0" -e "https://boards.4chan.org/" -o candidates/E_biboo_scream_23.mp4 "https://i.4cdn.org/vt/1787493454172.mp4"
          for f in candidates/*; do file "$f"; done

      - name: Upload temporary source candidates
        uses: actions/upload-artifact@v4
        with:
          name: vtube-source-candidates
          path: candidates/
          retention-days: 1
          compression-level: 0
